name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6'

      - name: Restore dependencies
        run: dotnet restore -p:NuGetAudit=false

      - name: Build
        run: dotnet build -c Release -p:NuGetAudit=false -p:TreatWarningsAsErrors=false

      - name: Run unit tests
        run: dotnet test EventsExpress.Test -c Release --no-build