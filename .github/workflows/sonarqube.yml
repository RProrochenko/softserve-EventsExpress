name: SonarQube
on:
  push:
    branches: [ development ]
  workflow_dispatch:
jobs:
  sonarqube:
    runs-on: [ self-hosted, linux ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Begin
        run: dotnet sonarscanner begin /k:"softserve-eventsexpress" /n:"softserve-EventsExpress" /d:sonar.host.url="$SONAR_HOST_URL" /d:sonar.token="$SONAR_TOKEN" "/d:sonar.exclusions=**/node_modules/**"
      - name: Build
        run: dotnet build EventsExpress.sln -c Release -p:NuGetAudit=false -p:TreatWarningsAsErrors=false
      - name: End
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
